packages:
  - packages/*

allowBuilds:
  '@parcel/watcher': false
  '@sentry/cli': false
  '@tailwindcss/oxide': false
  esbuild: false
  unrs-resolver: false
  vue-demi: false

overrides:
  # These releases are the newest complete Nuxt/Vue sets currently published.
  '@nuxt/devtools': 3.4.1
  vue: 3.5.41
  # Keep vulnerable transitive tooling on patched, API-compatible releases.
  '@babel/core@<=7.29.0': 7.29.7
  'brace-expansion@>=5.0.0 <5.0.9': 5.0.9
  'nanoid@>=3.0.0 <3.3.18': 3.3.18
  'postcss@<=8.5.22': 8.5.26
  'valibot@<=1.4.1': 1.4.2
